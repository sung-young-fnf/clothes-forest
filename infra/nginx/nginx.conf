# 'Upgrade' 헤더 매핑 — http_upgrade가 비어있으면 'close'
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream closet_backend {
  # 두 BE 인스턴스 round-robin + 자동 fail-over
  server backend-1:8000 max_fails=3 fail_timeout=10s;
  server backend-2:8000 max_fails=3 fail_timeout=10s;
  keepalive 32;
}

server {
  listen 8080;
  server_name _;

  # 큰 페이지 캡처(base64) 등 대비
  client_max_body_size 10m;

  # ─── REST + WebSocket 공통 프록시 ───
  location / {
    proxy_pass http://closet_backend;
    proxy_http_version 1.1;

    # WebSocket upgrade — Socket.io 핸드셰이크 필수
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 한 BE가 응답 안 하면 다음 upstream으로 자동 시도
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 86400s; # WebSocket idle 길게
  }
}

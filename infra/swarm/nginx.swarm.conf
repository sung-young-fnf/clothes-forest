# Swarm용 Nginx — backend 단일 서비스로 프록시.
# swarm 내장 VIP가 backend의 모든 replica에 자동 라운드로빈 분산.
# replica가 2→4로 늘어도 이 설정은 그대로 (재배포 불필요).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_name _;
  client_max_body_size 10m;

  # docker 내장 DNS — backend VIP를 런타임에 재확인 (replica 변동 추적)
  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    # 변수로 두면 nginx가 부팅 시 고정 resolve하지 않고 런타임 resolve
    set $upstream_backend backend;
    proxy_pass http://$upstream_backend:8000;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout 86400s;
  }
}

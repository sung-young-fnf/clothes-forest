# Closet Room — V1 HA 구성 (BE 2대 + Nginx LB + Valkey)
# 한 번에 기동: docker compose up --build
#
# 구성:
#   - frontend         → http://localhost:3000
#   - nginx (LB)       → http://localhost:8000 → backend-1/2 round-robin
#   - backend-1, -2    → 내부 only, INSTANCE_ID로 구분
#   - valkey (Redis)   → Socket.io adapter + presence + rate limit 중앙화
#
# DB는 SQLite 파일 (V1). 호스트 ./apps/closet-room/backend/data를 두 BE가 공유 마운트.
# V2 전환 시 Postgres로 (clothesPlan §11.3 — 동시 50명+ 트리거).

x-backend-common: &backend-common
  build:
    context: .
    dockerfile: apps/closet-room/backend/Dockerfile
  restart: unless-stopped
  depends_on:
    valkey:
      condition: service_healthy
    postgres:
      condition: service_healthy
    db-push:
      condition: service_completed_successfully
  healthcheck:
    test:
      - CMD-SHELL
      - 'node -e "require(''http'').get(''http://localhost:8000/api/health'',r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"'
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s

x-backend-env: &backend-env
  # 두 BE가 공유하는 Postgres (HA 핵심 — SQLite로는 멀티 인스턴스 불가)
  DATABASE_URL: "postgresql://closet:closet@postgres:5432/closet_room?schema=public"
  JWT_SECRET: "${JWT_SECRET:-dev-secret-change-me-in-production}"
  CORS_ORIGINS: "http://localhost:3000"
  REDIS_URL: "redis://valkey:6379"
  AWS_REGION: "${AWS_REGION:-us-west-2}"
  AWS_BEARER_TOKEN_BEDROCK: "${AWS_BEARER_TOKEN_BEDROCK:-}"
  SONNET_MODEL_ID: "${SONNET_MODEL_ID:-us.anthropic.claude-sonnet-4-5-20250929-v1:0}"
  # MinIO (S3 호환 객체 스토리지) — internal DNS로 컨테이너간 접근
  MINIO_ENDPOINT: "minio"
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
  MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
  MINIO_BUCKET: "${MINIO_BUCKET:-closet-room}"

services:
  valkey:
    image: valkey/valkey:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: closet
      POSTGRES_PASSWORD: closet
      POSTGRES_DB: closet_room
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closet -d closet_room"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO — S3 호환 객체 스토리지 (Docker 실습)
  # API: localhost:9000, Web Console: localhost:9001
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # 일회성 스키마 동기화 (Postgres에 prisma db push). 두 BE는 이게 끝난 후 시작.
  db-push:
    build:
      context: .
      dockerfile: apps/closet-room/backend/Dockerfile
    command: ["sh", "-c", "npx prisma db push --skip-generate --accept-data-loss"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *backend-env

  backend-1:
    <<: *backend-common
    environment:
      <<: *backend-env
      INSTANCE_ID: "backend-1"

  backend-2:
    <<: *backend-common
    environment:
      <<: *backend-env
      INSTANCE_ID: "backend-2"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend-1
      - backend-2
    ports:
      - "8000:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      context: .
      dockerfile: apps/closet-room/frontend/Dockerfile
      args:
        # 브라우저 socket.io 연결 endpoint (호스트 기준 → Nginx)
        NEXT_PUBLIC_BACKEND_URL: "http://localhost:8000"
    restart: unless-stopped
    depends_on:
      - nginx
    ports:
      - "3000:3000"
    environment:
      # 서버측 BFF는 internal docker network로 Nginx 호출
      BACKEND_URL: "http://nginx:8080"
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:8000"
      AUTH_SECRET: "${AUTH_SECRET:-dev-secret-change-me}"
      NEXTAUTH_URL: "http://localhost:3000"
      # NextAuth v5가 docker 환경(프록시 뒤)에서 host 신뢰
      AUTH_TRUST_HOST: "true"
      # Azure AD SSO — .env에서 주입 (값은 사용자가 .env에 입력)
      AZURE_AD_CLIENT_ID: "${AZURE_AD_CLIENT_ID:-}"
      AZURE_AD_CLIENT_SECRET: "${AZURE_AD_CLIENT_SECRET:-}"
      AZURE_AD_TENANT_ID: "${AZURE_AD_TENANT_ID:-}"
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "require(''http'').get(''http://localhost:3000'',r=>process.exit(r.statusCode<500?0:1)).on(''error'',()=>process.exit(1))"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  valkey_data:
  postgres_data:
  minio_data:

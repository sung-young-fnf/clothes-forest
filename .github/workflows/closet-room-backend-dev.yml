# closet-room Backend — Validate, Build, Push & Deploy (DEV)
#
# 필요한 GitHub Variables (environment: dev):
#   ECR_URL_BACKEND=xxxx.dkr.ecr.ap-northeast-2.amazonaws.com/repo-backend
#   ROLE_ARN=arn:aws:iam::xxxx:role/ecr-push-role
#   AWS_REGION=ap-northeast-2

name: "closet-room Backend DEV"

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "apps/closet-room/backend/**"
      - "packages/**"
      - ".github/workflows/closet-room-backend-dev.yml"

concurrency:
  group: "closet-room-backend-dev-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Set image tag
        id: tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo "image_tag=${SHORT_SHA}-${TIMESTAMP}" >> $GITHUB_OUTPUT

  validate:
    name: Validate Backend
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter='./packages/*'
      - name: Lint
        run: pnpm turbo lint --filter='./apps/closet-room/backend'
        continue-on-error: true
      - name: Type Check
        run: pnpm turbo typecheck --filter='./apps/closet-room/backend'

  docker-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [setup]
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
            image=moby/buildkit:latest

      - name: AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.ROLE_ARN }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/closet-room/backend/Dockerfile
          push: true
          tags: |
            ${{ vars.ECR_URL_BACKEND }}:${{ needs.setup.outputs.image_tag }}
            ${{ vars.ECR_URL_BACKEND }}:dev-latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=min,scope=backend
          platforms: linux/amd64

  deploy:
    name: Update Helm & Deploy
    runs-on: ubuntu-latest
    needs: [setup, validate, docker-push]
    environment: dev
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update backend image tag
        run: |
          TAG="${{ needs.setup.outputs.image_tag }}"
          sed -i '/^backend:/,/^frontend:/ s/tag: .*/tag: "'"${TAG}"'"/' charts/closet-room/values-dev.yaml
          echo "Updated backend tag: ${TAG}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ needs.setup.outputs.image_tag }}"
          git add charts/closet-room/values-dev.yaml
          git diff --staged --quiet || git commit -m "chore(deploy): closet-room backend dev → ${TAG}"
          for i in {1..3}; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin ${{ github.ref_name }} && break
            sleep $((i * 2))
          done
